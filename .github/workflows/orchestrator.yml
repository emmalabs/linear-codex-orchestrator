name: linear-codex-orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: emma-linear-codex-orchestrator once
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REPO_MAP_JSON: ${{ secrets.REPO_MAP_JSON }}
          DRY_RUN: "false"
