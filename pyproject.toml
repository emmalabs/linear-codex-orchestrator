[project]
name = "linear-codex-orchestrator"
version = "0.1.0"
description = "Poll Linear issues and orchestrate local Codex implementation workflows."
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
linear-codex-orchestrator = "linear_codex_orchestrator.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
